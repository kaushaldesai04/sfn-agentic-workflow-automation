[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-workflow-automation"
version = "0.1.0"
description = "AWS Step Functions workflow with advisory Amazon Bedrock Agent decisions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aws-cdk-lib>=2.170.0,<3.0.0",
  "aws-lambda-powertools>=3.3.0,<4.0.0",
  "boto3>=1.35.0",
  "constructs>=10.4.0,<11.0.0",
  "pydantic>=2.10.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.8.0",
  "boto3-stubs[bedrock-agent-runtime,dynamodb,sfn]>=1.35.0",
  "mypy>=1.13.0",
  "pip-audit>=2.7.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
include = ["agentic_workflow*", "functions*", "shared*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agentic_workflow", "functions", "shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["agentic_workflow", "functions", "shared"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.bandit]
exclude_dirs = ["tests", "cdk.out"]
